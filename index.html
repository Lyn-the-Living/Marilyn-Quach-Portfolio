<main>
  <section class="carousel" aria-label="Featured artwork">
    <div class="carousel-images">
      <img
        class="carousel-image"
        src="Images/carousel/abusedandconfused.JPG"
        alt="Abused and Confused"
        aria-hidden="false"
      >
      <img
        class="carousel-image"
        src="Images/carousel/childhoodmirror.webp"
        alt="Childhood Mirror"
        aria-hidden="true"
      >
      <img
        class="carousel-image"
        src="Images/carousel/carouselartwork5.jpg"
        alt="Featured artwork"
        aria-hidden="true"
      >
      <img
        class="carousel-image"
        src="Images/carousel/meditationdream.png"
        alt="Meditation Dream"
        aria-hidden="true"
      >
      <button class="carousel-arrow carousel-arrow-previous" type="button" aria-label="Previous image">
        &#8249;
      </button>
      <button class="carousel-arrow carousel-arrow-next" type="button" aria-label="Next image">
        &#8250;
      </button>
    </div>
    <div class="carousel-pagination" aria-label="Choose an image">
      <button class="carousel-dot" type="button" data-slide="0" aria-label="Show image 1" aria-current="true"></button>
      <button class="carousel-dot" type="button" data-slide="1" aria-label="Show image 2"></button>
      <button class="carousel-dot" type="button" data-slide="2" aria-label="Show image 3"></button>
      <button class="carousel-dot" type="button" data-slide="3" aria-label="Show image 4"></button>
    </div>
    <p class="carousel-status" aria-live="polite">Image 1 of 4</p>
  </section>
</main>

<script>
  const carousel = document.querySelector(".carousel");
  const carouselImages = [...document.querySelectorAll(".carousel-image")];
  const carouselDots = [...document.querySelectorAll(".carousel-dot")];
  const carouselArrows = document.querySelectorAll(".carousel-arrow");
  const carouselStatus = document.querySelector(".carousel-status");
  let currentSlide = 0;
  let autoplayTimer;

  function showSlide(index) {
    currentSlide = (index + carouselImages.length) % carouselImages.length;

    carouselImages.forEach((image, imageIndex) => {
      const isCurrent = imageIndex === currentSlide;
      image.setAttribute("aria-hidden", String(!isCurrent));
    });

    carouselDots.forEach((dot, dotIndex) => {
      if (dotIndex === currentSlide) {
        dot.setAttribute("aria-current", "true");
      } else {
        dot.removeAttribute("aria-current");
      }
    });

    carouselStatus.textContent = `Image ${currentSlide + 1} of ${carouselImages.length}`;
  }

  carouselArrows.forEach((arrow) => {
    arrow.addEventListener("click", () => {
      const direction = arrow.classList.contains("carousel-arrow-next") ? 1 : -1;
      showSlide(currentSlide + direction);
    });
  });

  carouselDots.forEach((dot) => {
    dot.addEventListener("click", () => {
      showSlide(Number(dot.dataset.slide));
      startCarouselAutoplay();
    });
  });

  function startCarouselAutoplay() {
    window.clearInterval(autoplayTimer);
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    autoplayTimer = window.setInterval(() => {
      if (!carousel.matches(":hover") && !carousel.contains(document.activeElement)) {
        showSlide(currentSlide + 1);
      }
    }, 6000);
  }

  carouselArrows.forEach((arrow) => {
    arrow.addEventListener("click", startCarouselAutoplay);
  });
  carousel.addEventListener("mouseleave", startCarouselAutoplay);
  carousel.addEventListener("focusout", (event) => {
    if (!carousel.contains(event.relatedTarget)) startCarouselAutoplay();
  });

  startCarouselAutoplay();
</script>
</body>
