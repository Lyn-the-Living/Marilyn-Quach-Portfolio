<dialog class="artwork-lightbox" aria-label="Enlarged artwork">
  <button class="lightbox-close" type="button" aria-label="Close enlarged image">&times;</button>
  <img class="lightbox-image" alt="">
  <p class="lightbox-caption"></p>
</dialog>

<script>
  const lightbox = document.querySelector(".artwork-lightbox");
  const lightboxImage = lightbox.querySelector(".lightbox-image");
  const lightboxCaption = lightbox.querySelector(".lightbox-caption");

  document.querySelectorAll(".artwork-card[data-lightbox]").forEach((card) => {
    card.addEventListener("click", (event) => {
      event.preventDefault();
      const image = card.querySelector("img");
      lightboxImage.src = image.src;
      lightboxImage.alt = image.alt;
      lightboxCaption.textContent = card.dataset.title;
      lightbox.showModal();
    });
  });

  lightbox.querySelector(".lightbox-close").addEventListener("click", () => lightbox.close());
  lightbox.addEventListener("click", (event) => {
    if (event.target === lightbox) {
      lightbox.close();
    }
  });
</script>
